name: scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run signal bot
        env:
          # ── SECRETS (Settings > Secrets and variables > Actions > Secrets) ──
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # ── VARIABLES (Settings > Secrets and variables > Actions > Variables) ──
          TARGET_RR: ${{ vars.TARGET_RR }}
          MAX_OPEN: ${{ vars.MAX_OPEN }}
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY }}
          FEE_PER_SIDE: ${{ vars.FEE_PER_SIDE }}
          REPORT_EVERY_HOURS: ${{ vars.REPORT_EVERY_HOURS }}

          # ── FIXED ──
          RUN_FOREVER: "0"
          SIGNAL_HISTORY_FILE: signals_history.json
        run: python signal_bot.py

      - name: Commit history
        if: always()
        run: |
          [ -f signals_history.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals_history.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan history."
          else
            git commit -m "update signals history [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
